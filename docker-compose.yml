services:
  plugged:
    build:
      context: .
      args:
        PLUGGED_UID: ${PLUGGED_UID:-1000}
        PLUGGED_GID: ${PLUGGED_GID:-1000}
    # Supported on native Linux. Keep the dashboard's loopback-only bind.
    network_mode: host
    command: ["dashboard"]
    volumes:
      # Mount the checkout directory, not individual config files: setup and
      # training atomically replace files and create plugged.local.yaml.
      # Source, configuration, knowledge, and data therefore survive recreation.
      # PLUGGED reads .env itself; env_file would pin stale values at creation.
      - type: bind
        source: .
        target: /app
        bind:
          create_host_path: false
      # The Claude CLI refreshes OAuth tokens in place.
      - type: bind
        source: ${HOME}/.claude
        target: /home/plugged/.claude
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
